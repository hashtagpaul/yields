# Yields — le réveil du serveur du jeu (offre gratuite de Supabase : un projet sans activité pendant une semaine est mis en pause).
# Chaque jour, une tâche planifiée de GitHub appelle la fonction publique ping() du projet, qui ne lit ni n'écrit rien.
# L'adresse du projet et sa clé publique viennent des secrets du dépôt (Settings → Secrets and variables → Actions) :
# SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY. Sans eux, le réveil est sauté, sans erreur.
name: Réveil du serveur
on:
  schedule:
    - cron: '17 6 * * *'   # chaque jour à 6 h 17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler ping()
        env:
          URL_PROJET: ${{ secrets.SUPABASE_URL }}
          CLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL_PROJET" ] || [ -z "$CLE" ]; then echo "secrets absents : réveil sauté"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL_PROJET/rest/v1/rpc/ping" \
            -H "apikey: $CLE" -H 'Content-Type: application/json' -d '{}')
          echo "ping : HTTP $code"
          test "$code" = "200"
